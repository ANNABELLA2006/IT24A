<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
</head>
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style>
        #map {height: 400px;}
        .popup-image {
            max-width: 200px;
            height: auto;
        }
     </style>
    

<body>
    <h1>Basic Map</h1>
     <div id="map"></div>
</body>
<script>

    var map = L.map('map').setView([8.364134417882672, 124.87124919788782], 17);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var marker = L.marker([8.364134417882672, 124.87124919788782]).addTo(map);
const catImage ="<img src=' https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DrvX8cS-v2XM&psig=AOvVaw1yUxscYdnYp_YU208VxlyO&ust=1761005308261000&source=images&cd=vfe&opi=89978449&ved=0CBIQjRxqFwoTCOCv55C-sZADFQAAAAAdAAAAABAE' class = 'popup-image'>";
const popupContent = "$'{catImage}<br><b>Hello World!</b><br>This is a popup.'";

marker.bindPopup(popupContent);
</script>
</html>
